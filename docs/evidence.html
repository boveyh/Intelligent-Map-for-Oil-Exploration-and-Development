<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生成器敏感性审计 · 测井工作台</title>
<style>body{margin:0;background:#f5f3ec;color:#283d33;font:15px/1.8 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:30px 20px}a{color:#236454}h1{font-size:28px;margin:10px 0}h2{font-size:20px}label{display:inline-grid;gap:4px;margin:10px 20px 10px 0}select{font:inherit;padding:7px;max-width:90vw;border:1px solid #9cb2a4;border-radius:5px;background:white}section{border:1px solid #d5ddcf;padding:20px;background:#fff;border-radius:10px;margin:16px 0}svg{width:100%;height:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid #e2e6dc}small{color:#607466}.scroll{overflow:auto}#status{padding:12px;background:#e9f1e8}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #286b53;outline-offset:3px}@media(max-width:600px){main{padding:16px 12px}section{padding:12px}h1{font-size:22px}}</style>
<main><a href="../index.html#/">← 返回工作台</a><h1>同一个模型，生成条件改变后会怎样？</h1><p>这里公开合成审计的全部档位。没有真实井成绩；曲线不保证单调，模型不保证胜出。物理参考只支持定性关系，不校准这些数值参数。</p><p><a href="evidence/expansion-audit.md">十三例扩展审计</a> · <a href="evidence/expansion-audit.json" download>扩展审计完整 JSON</a> · <a href="evidence/generator-audit.md">生成假设、审计报告与参考来源</a> · <a href="evidence/generator-audit.json" download>下载种子、配置、逐样本与曲线 JSON</a> · <a href="teaching-test/PROTOCOL.md">可选测试方案（本轮不开展）</a></p><p id="status" role="status">正在载入公开审计…</p><label>案例<select id="case" aria-label="选择审计案例"></select></label><label>扰动类型<select id="axis" aria-label="选择生成器扰动"></select></label><section><h2 id="title"></h2><p id="scope"></p><div id="chart"></div><div class="scroll"><table id="results"></table></div><p id="extra"></p></section><section id="threshold" hidden><h2>w3 阈值诊断：误报与漏检怎样交换？</h2><p>曲线使用已观察过的 20 图，属事后诊断，不是开发调参结果。候选 ROC 把可匹配标注的单条候选标正（允许重复正候选）；对象 PR 则经过间隔抑制和一对一匹配，分母不同。</p><div id="roc"></div><div id="pr"></div><div class="scroll"><table id="threshold-table"></table></div></section></main>
<script>
'use strict';
const select=document.querySelector('#case'),axis=document.querySelector('#axis'),names={rho:'AR(1) 创新相关系数',transition:'箱式响应半宽（点）',shift:'测试类别对比压缩比例',denShift:'测试 DEN 偏移 g/cm³',cnlShift:'测试 CNL 偏移 v/v',noiseScale:'附加噪声幅度',noiseMultiplier:'图像噪声倍数',apertureMultiplier:'路径厚度倍数',dropout:'连续方位缺测比例',drift:'目标井刻度漂移',overlap:'目标类别重叠',warp:'非线性响应错配',gapLength:'连续遮蔽长度 m',mechanism:'缺测机制'};
let data;
function f(v){return typeof v==='number'?v.toFixed(3):v;}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function chart(rows,lines,label,xy=false){
 const w=800,h=335,x0=65,y0=25,x1=770,y1=250;
 const all=rows.flatMap(r=>lines.map(l=>r[l.key])).filter(Number.isFinite),max=Math.max(...all,1)*1.08;
 const x=(r,i)=>xy?x0+r.x*(x1-x0):x0+i/(rows.length-1||1)*(x1-x0),y=v=>y1-v/(xy?1:max)*(y1-y0);
 let s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(label)+'"><title>'+esc(label)+'</title>';
 for(let i=0;i<=4;i++){const v=(xy?1:max)*i/4,yy=y(v);s+='<path d="M'+x0+' '+yy+'H'+x1+'" stroke="#e3e8dc"/><text x="5" y="'+(yy+4)+'" font-size="12">'+v.toFixed(2)+'</text>';}
 for(const [li,l]of lines.entries()){const points=rows.map((r,i)=>x(r,i)+','+y(r[l.key])).join(' ');s+='<polyline points="'+points+'" fill="none" stroke="'+l.color+'" stroke-width="2.5"/><text x="'+(65+(li%2)*350)+'" y="'+(292+Math.floor(li/2)*20)+'" fill="'+l.color+'" font-size="13">'+l.label+'</text>';}
 rows.forEach((r,i)=>{if(!xy)s+='<text x="'+x(r,i)+'" y="270" text-anchor="middle" font-size="12">'+esc(r.value)+'</text>';});
 return s+'</svg>';
}
function render(){const c=data.cases[select.value],rows=c.series.filter(r=>r.axis===axis.value);document.querySelector('#title').textContent=c.title+' · '+c.metric;document.querySelector('#scope').textContent=c.limits;
 const lines=[{key:'baseline',label:'基线',color:'#ad7545'},{key:'learn',label:'学习分支',color:'#2f7d6b'}];if(rows[0].alternate!==undefined)lines.push({key:'alternate',label:'附加对照（定义见案例）',color:'#8872a2'});if(rows[0].denOnly!==undefined)lines.push({key:'denOnly',label:'DEN 单变量回归',color:'#6e79aa'});if(rows[0].raw!==undefined)lines.push({key:'raw',label:'GR+DEN 固定缩放 KNN',color:'#557791'});if(rows[0].grOnly!==undefined)lines.push({key:'grOnly',label:'GR 单特征 KNN',color:'#8a6e98'});
 document.querySelector('#chart').innerHTML=chart(rows,lines,(names[axis.value]||axis.value)+' 对 '+c.metric+' 的影响；精确数字见下表');
 document.querySelector('#results').innerHTML='<tr><th>设置</th>'+lines.map(l=>'<th>'+esc(l.label)+'</th>').join('')+(rows[0].coverage!==undefined?'<th>回归区间覆盖</th>':'')+'</tr>'+rows.map(r=>'<tr><td>'+esc(r.value)+'</td>'+lines.map(l=>'<td>'+f(r[l.key])+'</td>').join('')+(r.coverage!==undefined?'<td>'+f(r.coverage)+'</td>':'')+'</tr>').join('');
 document.querySelector('#extra').textContent=c.heldout?'95% 配对 bootstrap 区间（冻结训练集；2000 次，以井/图为单位）：基线 '+c.heldout.baseline.map(f).join('—')+'；学习 '+c.heldout.learn.map(f).join('—')+'；学习−基线差 '+c.heldout.pairedDifference.map(f).join('—'):'本组各档位使用 '+rows[0].rows.length+' 个公开种子的配对重复。逐样本数据与附加评价见 JSON。';
 document.querySelector('#threshold').hidden=!c.thresholdCurve;
 if(c.thresholdCurve){const t=c.thresholdCurve;document.querySelector('#roc').innerHTML=chart(t.map(q=>({x:q.candidate.fpr,tpr:q.candidate.tpr})),[{key:'tpr',label:'候选 ROC：FPR → TPR',color:'#6e79aa'}],'候选 ROC 曲线',true);document.querySelector('#pr').innerHTML=chart(t.map(q=>({x:q.object.recall,precision:q.object.precision})),[{key:'precision',label:'对象 PR：召回 → 精确率',color:'#2f7d6b'}],'完整对象匹配的精确率与召回',true);document.querySelector('#threshold-table').innerHTML='<tr><th>阈值</th><th>对象精确率</th><th>对象召回</th><th>误报/漏检</th><th>候选 FPR/TPR</th></tr>'+t.map(q=>'<tr><td>'+q.threshold+'</td><td>'+f(q.object.precision)+'</td><td>'+f(q.object.recall)+'</td><td>'+q.object.fp+' / '+q.object.fn+'</td><td>'+f(q.candidate.fpr)+' / '+f(q.candidate.tpr)+'</td></tr>').join('');}
}
function choose(){const c=data.cases[select.value];axis.innerHTML=[...new Set(c.series.map(r=>r.axis))].map(a=>'<option value="'+a+'">'+(names[a]||a)+'</option>').join('');render();}
Promise.all(['generator-audit.json','expansion-audit.json'].map(n=>fetch('evidence/'+n).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();}))).then(parts=>{const d={date:parts[0].date,cases:Object.assign({},...parts.map(x=>x.cases))};data=d;select.innerHTML=Object.entries(d.cases).map(([k,c])=>'<option value="'+k+'">'+k+' '+c.title+'</option>').join('');document.querySelector('#status').textContent='公开配置 '+d.date+' · '+Object.values(d.cases).reduce((n,c)=>n+c.series.length,0)+' 组设置 · 十八例均至少三类条件 · 未做真实受试者测试';choose();}).catch(e=>{document.querySelector('#status').textContent='审计载入失败：'+e.message+'。请通过 HTTP(S) 打开，file:// 不受支持。';});
select.addEventListener('change',choose);axis.addEventListener('change',render);
</script></html>
